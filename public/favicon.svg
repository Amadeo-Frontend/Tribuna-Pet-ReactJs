<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente azul vibrante igual ao botão da marca Tribuna do Pet -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Fundo azul arredondado -->
  <rect width="512" height="512" rx="140" fill="url(#blueGrad)" />

  <!-- Patinha Branca no centro exatamente como no botão do logo -->
  <g fill="#ffffff" transform="translate(0, 10)">
    <!-- Dedinho 1 (Esquerda) -->
    <ellipse cx="145" cy="175" rx="34" ry="50" transform="rotate(-28 145 175)" />
    <!-- Dedinho 2 (Centro Esquerda) -->
    <ellipse cx="218" cy="130" rx="36" ry="54" transform="rotate(-10 218 130)" />
    <!-- Dedinho 3 (Centro Direita) -->
    <ellipse cx="294" cy="130" rx="36" ry="54" transform="rotate(10 294 130)" />
    <!-- Dedinho 4 (Direita) -->
    <ellipse cx="367" cy="175" rx="34" ry="50" transform="rotate(28 367 175)" />

    <!-- Coxim central (Almofada da pata) -->
    <path d="M 256 240 Q 345 235 375 305 Q 395 365 345 405 Q 256 425 167 405 Q 117 365 137 305 Q 167 235 256 240 Z" />
  </g>
</svg>